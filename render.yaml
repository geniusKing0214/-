# Render Blueprint — 영구 DB(PostgreSQL). 배포 후에도 회원·스케줄 데이터가 유지됩니다.
#
# 기존 웹 서비스만 쓰는 경우: Render 대시보드에서 PostgreSQL 인스턴스를 추가한 뒤,
# 웹 서비스 Environment에 DATABASE_URL(내부 연결 문자열)을 넣고, SESSION_SECRET_KEY는
# 재배포마다 바뀌지 않도록 한 값으로 고정하세요(세션만 풀리고 DB는 유지됩니다).
#
# 새로 연결할 때: Blueprint로 이 파일을 적용하거나, 아래 블록을 참고해 수동 생성합니다.
#
# SQLite만 컨테이너 기본 경로에 두면 재배포 시 DB가 비워질 수 있습니다. 앱은 Postgres 연결을 권장하며,
# 그 외 SQLite는 기동 시 차단됩니다. 예외만 필요하면 RENDER_ALLOW_SQLITE=1 (비권장).
#
# Firebase·관리자 메일 등은 Render 대시보드 → 웹 서비스 → Environment 에서 추가하세요.
# (FIREBASE_WEB_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_APP_ID,
#  FIREBASE_MESSAGING_SENDER_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_CREDENTIALS_JSON 등)

databases:
  - name: scheduler-db
    databaseName: scheduler
    user: scheduler
    region: oregon

services:
  - type: web
    name: scheduler-web
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # 위 DATABASE_URL(fromDatabase)로 PostgreSQL을 쓰면 재배포 후에도 데이터가 유지됩니다. 디스크 불필요.
    # Postgres 없이 Docker 이미지 기본값(SQLite @ /data)만 쓸 경우에만 Persistent Disk 추가:
    # disk:
    #   name: scheduler-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RENDER
        value: "true"
