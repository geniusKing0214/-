# Fly.io 배포: https://fly.io/docs/languages-and-frameworks/docker/
#
# fly auth login
# fly launch --no-deploy   # 또는 fly apps create <이름> 후 이 파일의 app 이름 수정
# fly volumes create scheduler_data --region nrt --size 1
# fly secrets set SESSION_SECRET_KEY="$(openssl rand -hex 32)"
# fly deploy
#
# volume 이름(scheduler_data)·region은 앱과 맞춰야 합니다.
# SQLite는 한 앱에 Machine 1대만 사용: fly scale count 1

app = "han-scheduler"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "scheduler_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite:////data/scheduler.db"
  SESSION_COOKIE_SECURE = "true"
