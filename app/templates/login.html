{% extends "base.html" %}

{% block content %}
<section class="card form-card">
    <h1>로그인</h1>

    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert success">{{ success }}</div>
    {% endif %}

    <form method="post" action="/login">
        <label for="username">이메일</label>
        <input type="email" id="username" name="username" placeholder="example@email.com" required autocomplete="username">

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">

        <button type="submit" class="btn btn-primary full">로그인</button>
    </form>

    <p class="form-bottom">
        계정이 없나요? <a href="/register">회원가입</a>
    </p>
</section>
{% endblock %}
