{% extends "base.html" %}

{% block content %}
<div class="page-wrap my-applications-page">
    <div class="page-header">
        <h1>알림</h1>
        <a href="/" class="btn btn-outline btn-sm">홈</a>
    </div>

    {% if notifications %}
    <ul class="operations-notify-list notifications-page-list">
        {% for n in notifications %}
        <li>
            <span class="member-date">{{ n.created_at.strftime("%Y-%m-%d %H:%M") if n.created_at else "" }}</span>
            {{ n.message }}
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="empty-box">알림이 없습니다.</div>
    {% endif %}
</div>
{% endblock %}
